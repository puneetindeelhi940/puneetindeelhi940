<style>
/* Matrix terminal: near-black green ground, cream text, phosphor green reserved for highlights and live state. Single dark world by choice. */
:root{
  --bg:#010c07; --bg-2:#02130b; --panel:rgba(3,22,13,.9); --panel-solid:#03160d; --panel-hi:#062616;
  --line:#0f4a2b; --line-soft:#0a3220;
  --phos:#4dff91; --phos-2:#2fbf6a; --phos-3:#155f37;
  --cream:#f3e9d2; --cream-2:#cfc3a6; --muted:#86a892;
  --amber:#f2c46b; --coral:#ff8f7a; --teal:#8fd3c8;
  --ui:'Roboto','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'Roboto Mono','Cascadia Mono',Consolas,ui-monospace,monospace;
  --r:8px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--cream)}
body{margin:0;font:400 14px/1.45 var(--ui);padding-inline:16px;padding-block:16px 24px;min-height:100vh}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.06;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.glow{text-shadow:0 0 8px rgba(77,255,145,.35)}

/* chrome */
.chrome{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2)}
.dots{display:flex;gap:6px;flex:none}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--phos-3);display:block;border:1px solid var(--phos-2)}
.dots i:first-child{background:var(--phos);box-shadow:0 0 8px var(--phos)}
.chrome h1{margin:0;font:500 13.5px/1.2 var(--mono);color:var(--cream);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chrome h1 b{color:var(--phos);font-weight:500}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;flex:none}
.live i{width:8px;height:8px;border-radius:50%;background:var(--phos);box-shadow:0 0 8px var(--phos);animation:pulse 1.4s infinite}
.paused .live i{animation:none;background:var(--amber);box-shadow:none}
@keyframes pulse{50%{opacity:.3}}

.eyebrow{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.concept{display:inline-block;font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(242,196,107,.45);border-radius:4px;padding:1px 6px}

/* log lines */
.ln{white-space:pre-wrap;word-break:break-word;animation:lnin .2s ease-out}
@keyframes lnin{from{opacity:0}to{opacity:1}}
.ln.cmd{color:var(--cream);margin-top:6px}
.ln.cmd .ps{color:var(--phos)}
.ln.amb{color:var(--muted);opacity:.78;font-size:.94em}
.caret{display:inline-block;width:.6em;height:1.05em;vertical-align:-2px;background:var(--phos);box-shadow:0 0 6px var(--phos);margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.c-ok{color:var(--phos)} .c-warn{color:var(--amber)} .c-err{color:var(--coral)} .c-dim{color:var(--muted)}
.c-k{color:var(--teal)} .c-hl{color:var(--bg);background:var(--phos);padding:0 4px;border-radius:3px}
.c-q{color:var(--cream-2);font-style:italic} .c-big{color:var(--phos);font-weight:500}

/* transport */
.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-2)}
.btn{font:500 12px var(--mono);color:var(--cream);background:var(--panel-hi);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;min-height:32px}
.btn:hover{border-color:var(--phos)}
.btn[aria-pressed="true"]{background:var(--phos);color:var(--bg);border-color:var(--phos)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.speeds{display:flex;gap:4px}
.scrub{flex:1;min-width:180px;display:flex}
.scrub input{width:100%;accent-color:var(--phos)}
.clock{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--cream);min-width:96px;text-align:right}
.kbd{font:400 11px var(--mono);color:var(--muted)}

/* footer */
footer.foot{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-start;justify-content:space-between;color:var(--muted);font:400 12px var(--ui);padding:4px 2px}
footer details{max-width:820px}
footer summary{cursor:pointer;color:var(--cream-2)}
footer ul{margin:8px 0 0;padding-left:18px;line-height:1.6}
footer .disc{margin:8px 0 0;color:var(--muted)}
footer .credit{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* svg text */
svg text{font-family:var(--mono)}

@media (max-width:720px){.kbd{display:none}}
@media (prefers-reduced-motion:reduce){.ln{animation:none}.caret,.live i{animation:none}}

/* live strip */
.strip{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;min-width:0}
.strip-h{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;padding:7px 12px 0}
.strip-h .eyebrow{display:flex;align-items:center;gap:7px}
.rec{width:7px;height:7px;border-radius:50%;background:var(--coral);display:inline-block;animation:pulse 1.2s infinite}
.strip-r{display:flex;flex-wrap:wrap;gap:2px 14px;margin-left:auto;font:400 11.5px var(--mono);color:var(--cream);font-variant-numeric:tabular-nums;min-width:0}
.strip-r em{font-style:normal;color:var(--muted);margin-right:3px}
.strip-r b{font-weight:500} .strip-r .ok{color:var(--phos)} .strip-r .warn{color:var(--amber)} .strip-r .err{color:var(--coral)}
.strip canvas{display:block;width:100%;height:96px}
@media (prefers-reduced-motion:reduce){.rec{animation:none}}

</style>

<style>
/* Layout: mission-control console. Phase rail, KPI strip, live telemetry strip, 3×2 instrument panes, transport. */

.proj{border:1px solid var(--line-soft);border-radius:var(--r);padding:11px 14px;background:var(--panel);display:flex;flex-direction:column;gap:3px}

.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;border:1px solid var(--line-soft);border-radius:var(--r);padding:10px 12px 12px;background:var(--panel);overflow:hidden;min-width:0}
.ph .fill{position:absolute;inset:auto 0 0 0;height:3px;background:var(--line-soft)}
.ph .fill i{display:block;height:100%;width:0;background:var(--phos);box-shadow:0 0 8px var(--phos)}
.ph h3{margin:2px 0 0;font:500 15px var(--ui);display:flex;align-items:center;gap:8px}
.ph small{display:block;color:var(--muted);font:400 11.5px var(--mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph small.meth{color:var(--cream-2);margin-top:6px}
.ph.on{border-color:var(--phos-2);background:var(--panel-hi)}

.kpi{border:1px solid var(--line-soft);border-radius:var(--r);padding:10px 12px;background:var(--panel);min-width:0;display:flex;flex-direction:column;gap:2px}
.kpi .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font:300 28px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--cream)}
.kpi .v.good{color:var(--phos);text-shadow:0 0 10px rgba(77,255,145,.35)} .kpi .v.bad{color:var(--coral)} .kpi .v.warn{color:var(--amber)} .kpi .v.none{color:var(--line)}
.kpi .n{font:400 11.5px var(--mono);color:var(--cream-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.kpi.flash{animation:flash 1.2s}
@keyframes flash{0%{background:#0b4a2a}100%{background:var(--panel)}}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pane{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel);display:flex;flex-direction:column;min-width:0;height:430px;overflow:hidden}
.pane header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-soft);background:var(--bg-2)}
.pane header h4{margin:0;font:500 12.5px var(--mono);color:var(--cream);white-space:nowrap}
.pane header span.role{font:400 11px var(--ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{margin-left:auto;flex:none;font:500 10px var(--mono);letter-spacing:.1em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.act{border-color:var(--phos);color:var(--bg);background:var(--phos);box-shadow:0 0 8px rgba(77,255,145,.5)}
.viz{padding:8px 12px 4px;border-bottom:1px dashed var(--line-soft);flex:none}
.viz svg{display:block;width:100%;height:auto}
.log{flex:1;overflow-y:auto;padding:8px 12px 10px;font:400 12px/1.55 var(--mono);color:var(--cream);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(1,12,7,.78);backdrop-filter:blur(3px);z-index:20;padding:16px}
.card{max-width:580px;width:100%;border:1px solid var(--phos-2);border-radius:12px;background:var(--panel-solid);padding:22px 24px;box-shadow:0 0 40px rgba(77,255,145,.15)}
.card h2{margin:6px 0 12px;font:500 22px/1.25 var(--ui);text-wrap:balance}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 14px;font:400 13px var(--mono)}
.card dt{color:var(--muted)} .card dd{margin:0} .card dd b{color:var(--phos);font-weight:500}
.card p{margin:0;color:var(--cream-2);font-size:13px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.rail{grid-template-columns:1fr}}
@media (max-width:720px){.grid{grid-template-columns:1fr}.pane{height:390px}.phases{grid-template-columns:repeat(2,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.kpi.flash{animation:none}}

<script>
/* ============ shared engine: clock, scripts, ambient activity, logs, live strips, matrix rain ============ */
const DUR = 120;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/\{(\w+):([^{}]*)\}/g, '<span class="c-$1">$2</span>');
const plain = s => String(s).replace(/\{\w+:([^{}]*)\}/g, '$1');
const mmss = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const pick = (r, a) => a[Math.floor(r() * a.length)];
const ri = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const rf = (r, a, b, d = 1) => (a + r() * (b - a)).toFixed(d);

/* script builder: time-anchored lines; warns when a block overruns its anchor */
function script(name, cps = 40){
  const L = []; let t = 0;
  const b = {
    cps,
    at(x){ if (t > x + 0.01) console.warn(`[${name}] overrun: ${t.toFixed(2)} > ${x}`); t = x; return b; },
    cmd(x, p = .35){ L.push({at:t, k:'cmd', x}); t += x.length / cps + p; return b; },
    o(x, d = .45, k = ''){ L.push({at:t, x, k}); t += d; return b; },
    bar(label, d, done){ L.push({at:t, d, k:'bar', label, done}); t += d + .3; return b; },
    lines(){ if (t > DUR - 0.3) console.warn(`[${name}] runs past loop end: ${t.toFixed(2)}`); return L; }
  };
  return b;
}

/* fill quiet gaps with deterministic background activity so no pane ever sits idle */
function ambient(L, pool, seed, {cps = 40, gap = 2.6, step = [1.7, 3.1], from = .9, to = 118.8} = {}){
  const r = rng(seed), out = []; let prev = -1;
  const next = at => { let i; do { i = Math.floor(r() * pool.length); } while (pool.length > 1 && i === prev); prev = i; return pool[i](r, at); };
  const busyEnd = l => l.at + (l.k === 'cmd' ? l.x.length / cps + .3 : l.k === 'bar' ? l.d + .3 : .35);
  const sorted = [...L].sort((a, b) => a.at - b.at);
  let cur = from;
  const fill = until => { let s = cur + step[0] + r() * (step[1] - step[0]) * .5; while (s < until - .7){ out.push({at:s, x:next(s), k:'amb'}); s += step[0] + r() * (step[1] - step[0]); } };
  for (const l of sorted){ if (l.at - cur > gap) fill(l.at); cur = Math.max(cur, busyEnd(l)); }
  if (to - cur > gap) fill(to);
  return [...L, ...out].sort((a, b) => a.at - b.at);
}

const barTxt = (label, p, done, n = 22) => {
  const f = Math.round(p * n);
  return fmt(`${label} {ok:${'█'.repeat(f)}}{dim:${'░'.repeat(n - f)}} ${String(Math.round(p * 100)).padStart(3)}%`) + (p >= 1 && done ? '  ' + fmt(done) : '');
};

class Log {
  constructor(el, lines, {max = 160, cps = 40, prompt = '❯ '} = {}){
    this.el = el; this.s = lines; this.max = max; this.cps = cps; this.prompt = `<span class="ps">${esc(prompt)}</span>`; this.stick = true;
    el.addEventListener('scroll', () => { this.stick = el.scrollHeight - el.scrollTop - el.clientHeight < 28; });
    this.reset();
  }
  reset(){ this.el.innerHTML = ''; this.i = 0; this.live = []; this.lastT = -1; this.lastAt = -99; this.stick = true; }
  render(t){
    if (t < this.lastT) this.reset();
    this.lastT = t; let added = false;
    while (this.i < this.s.length && this.s[this.i].at <= t){
      const ln = this.s[this.i++], d = document.createElement('div');
      d.className = 'ln ' + (ln.k || ''); this.el.appendChild(d); added = true;
      if (ln.k !== 'amb') this.lastAt = ln.at;
      if (ln.k === 'cmd' || ln.k === 'bar') this.live.push({ln, d}); else d.innerHTML = fmt(ln.x);
    }
    this.live = this.live.filter(({ln, d}) => {
      if (ln.k === 'bar'){ const p = clamp((t - ln.at) / ln.d, 0, 1); d.innerHTML = barTxt(ln.label, p, ln.done); return p < 1; }
      const n = Math.floor((t - ln.at) * this.cps);
      if (n >= ln.x.length){ d.innerHTML = this.prompt + esc(ln.x); return false; }
      d.innerHTML = this.prompt + esc(ln.x.slice(0, n)) + '<span class="caret"></span>'; return true;
    });
    while (this.el.children.length > this.max) this.el.firstChild.remove();
    if ((added || this.live.length) && this.stick) this.el.scrollTop = this.el.scrollHeight;
  }
}

/* step lookup: pts = [[t, value], ...] */
const stepIdx = (t, pts) => { let i = -1; pts.forEach((p, j) => { if (p[0] <= t) i = j; }); return i; };

/* ============ live strips (pure functions of sim time) ============ */
const STRIPS = {
  /* CPR depth trace: 110/min, 30:2 cycles; consistency improves after the redesigned flow ships (t ≥ 95) */
  cpr: {
    label: 'live · RQI station telemetry',
    stations: ['4W-02 · RN night · adult','ICU-3 · RN day · adult','PICU-1 · RN · infant','ED-7 · RN night · adult','5E-04 · new grad · adult','L&D-2 · RN · infant'],
    sample(s, t){
      const cyc = 20.4, k = s % cyc, per = 60/110, after = t >= 95;
      if (k >= 30*per) { const b = (k - 30*per) / 2; return {d: b < 2 ? .25*Math.pow(Math.sin(Math.PI*(b % 1)), 2) : 0, vent:true}; }
      const i = Math.floor(k / per), ph = (k % per) / per, n = Math.floor(s / cyc) * 31 + i;
      const base = after ? 5.45 : 5.0, spread = after ? .38 : .85;
      const depth = clamp(base + (hash(n) - .5) * 2 * spread, 3.6, 6.6);
      return {d: depth * Math.pow(Math.sin(Math.PI * ph), 2), depth, vent:false};
    },
    draw(ctx, w, h, t){
      const win = 6, top = 10, bot = h - 16, sy = d => top + d / 7 * (bot - top);
      ctx.fillStyle = 'rgba(77,255,145,.07)'; ctx.fillRect(0, sy(5), w, sy(6) - sy(5));
      ctx.strokeStyle = 'rgba(134,168,146,.35)'; ctx.setLineDash([3,4]); ctx.lineWidth = 1;
      [5,6].forEach(d => { ctx.beginPath(); ctx.moveTo(0, sy(d)); ctx.lineTo(w, sy(d)); ctx.stroke(); }); ctx.setLineDash([]);
      ctx.fillStyle = '#86a892'; ctx.font = '10px "Roboto Mono", monospace';
      ctx.textAlign = 'right'; ctx.fillText('5 cm', w - 4, sy(5) - 3); ctx.fillText('6 cm', w - 4, sy(6) + 11); ctx.textAlign = 'left';
      ctx.beginPath(); ctx.lineWidth = 1.6; ctx.strokeStyle = '#4dff91'; ctx.shadowColor = '#4dff91'; ctx.shadowBlur = 6;
      for (let x = 0; x <= w; x += 1.5){ const s = t - (w - x) / w * win; const v = s < 0 ? {d:0} : this.sample(s, t); const y = sy(v.d); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke(); ctx.shadowBlur = 0;
    },
    read(t){
      const per = 60/110, cyc = 20.4, after = t >= 95;
      let last = null; for (let s = t; s > t - 3; s -= per/3){ const v = this.sample(s, t); if (!v.vent && v.depth){ last = v.depth; break; } }
      const k = t % cyc, vent = k >= 30*per;
      const st = this.stations[Math.floor(t / cyc) % this.stations.length];
      const inT = last != null && last >= 5 && last <= 6;
      return [
        ['station', st],

        ['recoil', `${after ? 97 + Math.floor(hash(Math.floor(t)+3)*3) : 86 + Math.floor(hash(Math.floor(t)+3)*10)}%`],
        ['in target', `<b class="${after ? 'ok' : 'warn'}">${after ? 79 : 61}%</b>`]
      ];
    }
  },
  /* patient-monitor ECG from the sim room: sinus → VF → shock → CPR → ROSC, 40 s scenario loop */
  ecg: {
    label: 'live · sim room 2 · SimMan monitor',
    phase(sc){ return sc < 12 ? 'sinus' : sc < 19 ? 'vf' : sc < 24.5 ? 'cpr' : 'rosc'; },
    beat(p){ const g = (c, a, w) => a * Math.exp(-Math.pow((p - c) / w, 2)); return g(.18,.12,.03) + g(.3,-.12,.012) + g(.33,1,.012) + g(.36,-.28,.014) + g(.58,.3,.05); },
    sample(s){
      const sc = ((s % 40) + 40) % 40, ph = this.phase(sc);
      if (ph === 'sinus'){ const per = 60/88; return this.beat((sc % per) / per); }
      if (ph === 'vf') return .38 * Math.sin(sc * 31) * Math.sin(sc * 4.3 + 1) + .18 * Math.sin(sc * 19.7);
      if (ph === 'cpr'){ if (sc < 19.25) return sc < 19.08 ? 1.6 : -.6; const per = 60/110; return .55 * Math.sin(2 * Math.PI * (sc - 19.25) / per); }

    draw(ctx, w, h, t){
      const win = 5, mid = h * .55, amp = h * .34;
      ctx.strokeStyle = 'rgba(134,168,146,.18)'; ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 24){ ctx.beginPath(); ctx.moveTo(x, 8); ctx.lineTo(x, h - 8); ctx.stroke(); }
      ctx.beginPath(); ctx.lineWidth = 1.6; ctx.strokeStyle = '#4dff91'; ctx.shadowColor = '#4dff91'; ctx.shadowBlur = 6;
      for (let x = 0; x <= w; x += 1.2){ const s = t - (w - x) / w * win; const y = mid - this.sample(s) * amp; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke(); ctx.shadowBlur = 0;
      for (let x = 0; x <= w; x += 2){ const s = t - (w - x) / w * win, sc = ((s % 40) + 40) % 40; if (Math.abs(sc - 19) < .03){ ctx.fillStyle = '#f2c46b'; ctx.font = '11px "Roboto Mono", monospace'; ctx.fillText('⚡ 200 J', x + 4, 16); ctx.fillRect(x, 6, 1.5, h - 12); } }
    },
    read(t){
      const sc = t % 40, ph = this.phase(sc);
      const lbl = {sinus:'sinus 88', vf:'<b class="err">VF</b>', cpr:'<b class="warn">CPR in progress</b>', rosc:'<b class="ok">ROSC · sinus tach</b>'}[ph];
      const hr = {sinus:'88', vf:'—', cpr:'—', rosc:'112'}[ph];
      return [
        ['scenario', `adult IHCA #${Math.floor(t / 40) + 14}`],
        ['rhythm', lbl],
        ['HR', hr],
        ['time to shock', sc >= 19 ? '<b class="ok">01:52</b>' : sc >= 12 ? `<b class="warn">${mmss((sc - 12) * 16)}</b>` : '—'],
        ['events logged', String(Math.floor(sc * 1.7) + 3)]
      ];
    }
  }
};
function mountStrip(host, kind){
  const S = STRIPS[kind];
  host.innerHTML = `<div class="strip-h"><span class="eyebrow"><i class="rec"></i>${S.label}</span><div class="strip-r" aria-live="off"></div></div><canvas aria-label="${S.label}" role="img"></canvas>`;
  const cv = host.querySelector('canvas'), rd = host.querySelector('.strip-r');
  let lastR = -1;
  return t => {
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
    if (!w) return;
    if (cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    S.draw(ctx, w, h, t);
    const q = Math.floor(t * 4);
    if (q !== lastR){ lastR = q; rd.innerHTML = S.read(t).map(([k, v]) => `<span><em>${k}</em> ${v}</span>`).join(''); }
  };
}

/* ============ matrix rain (decorative, 6% opacity) ============ */
function startRain(){
  const cv = document.getElementById('rain'); if (!cv) return;
  const ctx = cv.getContext('2d'), G = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉ0123456789♥+<>=/'.split('');
  let cols = [], fs = 15, W = 0, H = 0;
  const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; cols = Array.from({length: Math.ceil(W / fs)}, (_, i) => hash(i) * H / fs); ctx.fillStyle = '#010c07'; ctx.fillRect(0, 0, W, H); };
  size(); addEventListener('resize', size);
  const draw = () => {
    ctx.fillStyle = 'rgba(1,12,7,.14)'; ctx.fillRect(0, 0, W, H); ctx.font = fs + 'px "Roboto Mono", monospace';
    cols.forEach((y, i) => { const ch = G[Math.floor(Math.random() * G.length)]; ctx.fillStyle = Math.random() < .08 ? '#f3e9d2' : '#4dff91'; ctx.fillText(ch, i * fs, y * fs); cols[i] = y * fs > H && Math.random() > .975 ? 0 : y + 1; });
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ for (let i = 0; i < 60; i++) draw(); return; }
  let last = 0; const loop = ts => { if (ts - last > 55){ last = ts; draw(); } requestAnimationFrame(loop); }; requestAnimationFrame(loop);
}

/* ============ clock & transport ============ */
function createSim(render, onWrap){
  const sim = {t: 0, speed: 1, playing: true, loops: 0};
  let last = null, scrubbing = false;
  const sc = $('#scrub');
  const draw = force => { render(sim.t, force); $('#clock').textContent = mmss(sim.t) + ' / 02:00'; if (!scrubbing) sc.value = sim.t.toFixed(1); };
  function frame(ts){
    if (last === null) last = ts;
    const dt = Math.min(.1, (ts - last) / 1000); last = ts;
    if (sim.playing && !scrubbing){ sim.t += dt * sim.speed; if (sim.t >= DUR){ sim.t = 0; sim.loops++; onWrap && onWrap(); draw(true); } }
    draw(false); requestAnimationFrame(frame);
  }
  function seek(t){ sim.t = clamp(t, 0, DUR - .01); onWrap && onWrap(); draw(true); }
  function setPlaying(p){ sim.playing = p; const b = $('#play'); b.textContent = p ? '❚❚ Pause' : '▶ Play'; b.setAttribute('aria-label', p ? 'Pause simulation' : 'Play simulation'); $('#app').classList.toggle('paused', !p); $('#liveTxt').textContent = p ? 'live' : 'paused'; }
  function setSpeed(s){ sim.speed = s; document.querySelectorAll('[data-speed]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.speed === s))); }
  $('#play').onclick = () => setPlaying(!sim.playing);
  $('#restart').onclick = () => { seek(0); setPlaying(true); };
  document.querySelectorAll('[data-speed]').forEach(x => x.onclick = () => setSpeed(+x.dataset.speed));
  sc.addEventListener('input', () => { scrubbing = true; seek(+sc.value); });
  sc.addEventListener('change', () => { scrubbing = false; });
  sc.addEventListener('pointerup', () => { scrubbing = false; });
  document.addEventListener('keydown', e => {
    if (e.target.closest('input,button,summary') && e.key === ' ') return;
    if (e.key === ' '){ e.preventDefault(); setPlaying(!sim.playing); }
    else if (e.key === 'ArrowRight') seek(sim.t + 5);
    else if (e.key === 'ArrowLeft') seek(sim.t - 5);
    else if (['1','2','4'].includes(e.key)) setSpeed(+e.key);
  });
  window.__sim = {seek, setSpeed, setPlaying, get t(){ return sim.t; }, get loops(){ return sim.loops; }};
  startRain();
  draw(true); requestAnimationFrame(frame);
  return sim;
}

    {label:'Median session time', target:'target ≤ 10:00', pts:[

/* ============ Mission Control renderer (data comes from STORY) ============ */
(() => {
const S = STORY, W = 320;
const PH_TIMES = ['0:00','0:30','1:00','1:30'];
const DEF_METH = ['interviews · shadowing · survey · baseline','affinity · POV · HMW · HEART','ideate · prototype · test R1, R2','benchmark · pilot · ship'];
const diamond = (shape, on) => `<svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><path d="${shape === 'div' ? 'M1 6 L15 1 L15 11 Z' : 'M1 1 L15 6 L1 11 Z'}" fill="none" stroke="${on ? 'var(--phos)' : 'var(--muted)'}" stroke-width="1.4"/></svg>`;

const VIZ = {
  codes(v, t){
    const done = v.items.filter(iv => iv.at <= t), cum = done.reduce((s, iv) => s + iv.codes, 0);
    const bw = 20, gap = 5.5, x0 = 4, base = 70, k = 44 / Math.max(...v.items.map(i => i.codes));
    let s = `<svg viewBox="0 0 ${W} 94" role="img" aria-label="${v.label}, ${cum} cumulative">`;
    s += `<text x="4" y="10" font-size="9" fill="var(--muted)">${v.label}</text><text x="${W-4}" y="10" font-size="9" fill="var(--cream)" text-anchor="end">Σ ${cum}</text>`;
    s += `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)"/>`;
    v.items.forEach((iv, i) => {
      const x = x0 + i*(bw+gap), on = iv.at <= t, h = Math.max(1.5, iv.codes*k);
      s += `<rect x="${x}" y="${on ? base-h : base-1.5}" width="${bw}" height="${on ? h : 1.5}" fill="${on ? (iv.codes <= 2 ? 'var(--phos-3)' : 'var(--phos-2)') : 'var(--line-soft)'}"/>`;
      if (on) s += `<text x="${x+bw/2}" y="${base-h-3}" font-size="8.5" fill="var(--cream-2)" text-anchor="middle">${iv.codes}</text>`;
      s += `<text x="${x+bw/2}" y="${base+11}" font-size="8" fill="${on ? 'var(--cream-2)' : 'var(--line)'}" text-anchor="middle">${iv.id.slice(1)}</text>`;
    });
    const sat = t >= v.items[v.items.length-1].at;
    return s + `<text x="4" y="92" font-size="9" fill="${sat ? 'var(--phos)' : 'var(--muted)'}">${sat ? v.satText : 'listening for saturation…'}</text></svg>`;
  },
  hbars(v, t){
    const max = Math.max(...v.items.map(i => i[1]));
    let s = `<svg viewBox="0 0 ${W} 92" role="img" aria-label="${v.label}"><text x="4" y="10" font-size="9" fill="var(--muted)">${v.label}</text>`;
    v.items.forEach(([name, n, start], i) => {
      const p = clamp((t - start)/13, 0, 1), c = Math.round(n*p), y = 18 + i*12.5;
      s += `<text x="4" y="${y+8}" font-size="8.5" fill="${p > 0 ? 'var(--cream-2)' : 'var(--line)'}">${name}</text>`;
      s += `<rect x="158" y="${y+1}" width="132" height="8" fill="var(--line-soft)"/><rect x="158" y="${y+1}" width="${132*c/max}" height="8" fill="${i === 0 ? 'var(--amber)' : 'var(--phos-2)'}"/>`;
      s += `<text x="${W-4}" y="${y+8}" font-size="8.5" fill="var(--cream)" text-anchor="end">${c}</text>`;
    });
    return s + '</svg>';
  },
  scatter(v, t){
    if (!v._ideas){ const r = rng(v.seed || 14); v._ideas = Array.from({length: v.n}, (_, i) => ({x:.06 + r()*.88, y:.06 + r()*.88, at:v.start + i*v.every}));
      const r2 = rng(7); v._park = Array.from({length: v.park}, (_, i) => ({x:.1 + r2()*.8, y:.1 + r2()*.8, at:v.parkAt + i*.4})); }
    const X = 30, Y = 14, w = 280, h = 72, px = q => X + q*w, py = q => Y + (1-q)*h;
    let s = `<svg viewBox="0 0 ${W} 100" role="img" aria-label="Impact versus effort matrix">`;
    s += `<rect x="${X}" y="${Y}" width="${w}" height="${h}" fill="none" stroke="var(--line)"/><line x1="${X+w/2}" y1="${Y}" x2="${X+w/2}" y2="${Y+h}" stroke="var(--line-soft)"/><line x1="${X}" y1="${Y+h/2}" x2="${X+w}" y2="${Y+h/2}" stroke="var(--line-soft)"/>`;
    [['quick wins',X+4,Y+10],['big bets',X+w/2+4,Y+10],['fill-ins',X+4,Y+h-4],['money pits',X+w/2+4,Y+h-4]].forEach(([l,x,y]) => s += `<text x="${x}" y="${y}" font-size="8" fill="var(--muted)">${l}</text>`);
    s += `<text x="4" y="10" font-size="9" fill="var(--muted)">IMPACT ↑</text><text x="${W-4}" y="97" font-size="9" fill="var(--muted)" text-anchor="end">EFFORT →</text>`;
    v._park.forEach(d => { if (d.at <= t) s += `<circle cx="${px(d.x)}" cy="${py(d.y)}" r="2.6" fill="none" stroke="var(--cream-2)" stroke-width=".8"/>`; });
    const shown = v._ideas.filter(d => d.at <= t);
    shown.forEach(d => s += `<circle cx="${px(d.x)}" cy="${py(d.y)}" r="2.3" fill="var(--phos-2)"/>`);
    v.picks.forEach(p => { if (p.at <= t) s += `<circle cx="${px(p.x)}" cy="${py(p.y)}" r="6" fill="var(--phos)"/><text x="${px(p.x)}" y="${py(p.y)+3}" font-size="8" font-weight="500" fill="var(--bg)" text-anchor="middle">${p.l}</text>`; });
    return s + `<text x="4" y="97" font-size="9" fill="var(--cream)">${shown.length ? shown.length + ' ideas' : v._park.some(d => d.at <= t) ? 'parking lot' : 'awaiting POV'}</text></svg>`;
  },
  curve(v, t){
    const X = 30, Y = 22, w = 270, h = 58, px = n => X + n/8*w, py = q => Y + (1-q)*h;
    let s = `<svg viewBox="0 0 ${W} 104" role="img" aria-label="Share of usability problems found versus participants"><text x="4" y="10" font-size="9" fill="var(--muted)">PROBLEMS FOUND · 1−(1−0.31)ⁿ</text>`;
    [0,.5,1].forEach(q => s += `<line x1="${X}" y1="${py(q)}" x2="${X+w}" y2="${py(q)}" stroke="var(--line-soft)"/><text x="${X-4}" y="${py(q)+3}" font-size="8" fill="var(--muted)" text-anchor="end">${q*100}%</text>`);
    let d = ''; for (let n = 0; n <= 8; n += .1) d += (n ? 'L' : 'M') + px(n).toFixed(1) + ' ' + py(1 - Math.pow(.69, n)).toFixed(1);
    s += `<path d="${d}" fill="none" stroke="var(--teal)" stroke-width="1.4" stroke-dasharray="3 2"/>`;
    for (let n = 1; n <= 8; n++) s += `<text x="${px(n)}" y="${Y+h+11}" font-size="8" fill="var(--muted)" text-anchor="middle">${n}</text>`;
    v.obs.forEach(([n, c, at]) => { if (at <= t) s += `<circle cx="${px(n)}" cy="${py(c/v.est)}" r="3.2" fill="var(--phos)"/>`; });
    return s + `<text x="4" y="102" font-size="9" fill="var(--cream-2)">${t >= v.obs[0][2] ? v.after : v.before}</text></svg>`;
  },
  funnel(v, t){
    const pb = clamp((t - v.baseAt)/3, 0, 1), pv = clamp((t - v.varAt)/v.varDur, 0, 1);
    let s = `<svg viewBox="0 0 ${W} 96" role="img" aria-label="${v.label}"><text x="4" y="10" font-size="9" fill="var(--muted)">${v.label}</text>`;
    s += `<text x="${W-4}" y="10" font-size="9" text-anchor="end" fill="${pv > 0 ? 'var(--teal)' : 'var(--line)'}">■ ${v.legend[1]}</text><text x="${W-78}" y="10" font-size="9" text-anchor="end" fill="var(--amber)">■ ${v.legend[0]}</text>`;
    v.steps.forEach(([l, b, a], i) => {
      const y = 18 + i*12.6, cur = b + (a - b)*pv;
      s += `<text x="4" y="${y+8}" font-size="8.5" fill="var(--cream-2)">${l}</text><rect x="92" y="${y}" width="${180*b/100*pb}" height="4.5" fill="var(--amber)"/>`;
      if (pv > 0) s += `<rect x="92" y="${y+5}" width="${180*cur/100}" height="4.5" fill="var(--teal)"/>`;
      if (pb >= 1) s += `<text x="${W-4}" y="${y+8}" font-size="8.5" text-anchor="end" fill="var(--cream)">${pv > 0 ? cur.toFixed(0) : b}</text>`;
    });
    return s + '</svg>';
  },
  gauges(v, t){
    const after = t >= v.afterAt, before = t >= v.beforeAt;
    let s = `<svg viewBox="0 0 ${W} 92" role="img" aria-label="${v.label}"><text x="4" y="10" font-size="9" fill="var(--muted)">${v.label}</text>`;
    v.rows.forEach(([n, u, max, good, poor, b, a], i) => {
      const y = 22 + i*22, x0 = 70, w = 196, sx = q => x0 + Math.min(q/max, 1)*w;
      s += `<text x="4" y="${y+7}" font-size="8.5" fill="var(--cream)">${n}</text>`;
      s += `<rect x="${x0}" y="${y}" width="${sx(good)-x0}" height="8" fill="#0f5a33"/><rect x="${sx(good)}" y="${y}" width="${sx(poor)-sx(good)}" height="8" fill="#5a4a1c"/><rect x="${sx(poor)}" y="${y}" width="${x0+w-sx(poor)}" height="8" fill="#5a2a22"/>`;
      if (before){ const q = after ? a : b;
        s += `<path d="M${sx(q)-4} ${y-5} L${sx(q)+4} ${y-5} L${sx(q)} ${y} Z" fill="var(--cream)"/><text x="${W-4}" y="${y+7}" font-size="9" text-anchor="end" fill="${after ? 'var(--phos)' : 'var(--amber)'}">${q}${u}</text>`; }
    });
    return s + `<text x="4" y="90" font-size="9" fill="var(--cream-2)">${before ? (after ? v.captionAfter : v.captionBefore) : 'awaiting baseline'}</text></svg>`;
  }
};

mountMeta(S.meta);
$('#phases').innerHTML = S.phases.map((p, i) => `<div class="ph" id="ph${i}"><div class="eyebrow">${PH_TIMES[i]} · ${p.shape === 'div' ? 'diverge' : 'converge'}</div><h3>${diamond(p.shape)}${p.name}</h3><small>d.school: ${p.mode}</small><small class="meth">${p.methods || DEF_METH[i]}</small><div class="fill"><i></i></div></div>`).join('');
$('#kpis').innerHTML = S.kpis.map((k, i) => `<div class="kpi" id="k${i}"><div class="eyebrow">${k.label}</div><div class="v none">—</div><div class="n">not measured yet</div><div class="trail">&nbsp;</div><div class="tg">${k.target}</div></div>`).join('');
$('#grid').innerHTML = S.panes.map(p => `<section class="pane" aria-label="${p.file}"><header><h4>${p.file}</h4><span class="role">${p.role}</span><span class="pill" id="pill-${p.id}">STANDBY</span></header><div class="viz" id="viz-${p.id}"></div><div class="log" id="log-${p.id}"></div></section>`).join('');
$('#card').innerHTML = `<div class="eyebrow">${S.overlay.eyebrow}</div><h2>${S.overlay.title}</h2><dl>${S.overlay.rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl><p id="restartTxt"></p>`;

const logs = S.panes.map(p => new Log($('#log-' + p.id), p.lines));
const strip = mountStrip($('#strip'), S.meta.strip);
const kpiState = S.kpis.map(() => null);
let lastViz = -1;

function render(t, force){
  logs.forEach((l, i) => {
    l.render(t);
    const act = l.lastAt >= 0 && t - l.lastAt < 3, pill = $('#pill-' + S.panes[i].id);
    if (pill._a !== act){ pill._a = act; pill.textContent = act ? 'ACTIVE' : 'MONITOR'; pill.classList.toggle('act', act); }
  });
  strip(t);
  const vt = Math.floor(t * 8);
  if (vt !== lastViz || force){ lastViz = vt; S.panes.forEach(p => { $('#viz-' + p.id).innerHTML = VIZ[p.viz.type](p.viz, t); }); }
  S.phases.forEach((p, i) => {
    const el = $('#ph' + i), f = clamp((t - i*30)/30, 0, 1), on = f > 0 && f < 1, st = on ? 1 : f >= 1 ? 2 : 0;
    el.querySelector('.fill i').style.width = (f*100) + '%';
    if (el._s !== st){ el._s = st; el.classList.toggle('on', on); el.querySelector('h3 svg').outerHTML = diamond(p.shape, on); }
  });
  S.kpis.forEach((k, i) => {
    const idx = stepIdx(t, k.pts);
    if (idx === kpiState[i]) return;
    const el = $('#k' + i), v = el.querySelector('.v');
    if (idx < 0){ v.className = 'v none'; v.textContent = '—'; el.querySelector('.n').textContent = 'not measured yet'; el.querySelector('.trail').innerHTML = '&nbsp;'; }
    else {
      const cur = k.pts[idx][1];
      v.className = 'v ' + cur.s; v.textContent = cur.v; el.querySelector('.n').textContent = cur.n;
      el.querySelector('.trail').textContent = idx ? k.pts.slice(0, idx+1).map(p => p[1].v).join(' → ') : 'baseline';
      if (kpiState[i] !== null && !force){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    }
    kpiState[i] = idx;
  });
  const ov = $('#overlay'), show = t >= 114.5;
  if (ov.hidden === show) ov.hidden = !show;
  if (show) $('#restartTxt').textContent = `${S.overlay.note} Next cycle starts in ${Math.max(1, Math.ceil(DUR - t))} s.`;
}
$('#overlay').addEventListener('click', () => window.__sim.seek(0));
createSim(render, () => kpiState.fill(null));
})();
