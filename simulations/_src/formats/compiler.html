<style>
/* Layout: compiler terminal (left) beside a live telemetry strip, double-diamond plot, phase stack and emitted artifacts (right). */
.body{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.term{background:rgba(1,10,6,.92);min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.term .log{flex:1 1 0;min-height:700px;overflow-y:auto;padding:14px 18px 18px;font:400 13px/1.6 var(--mono);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ln.stage{margin-top:14px;padding:4px 10px;border-left:3px solid var(--phos);background:var(--panel-hi);color:var(--cream);font-weight:500;text-shadow:0 0 8px rgba(77,255,145,.3)}
.statusbar{display:flex;flex-wrap:wrap;gap:4px 18px;padding:7px 18px;border-top:1px solid var(--line);background:var(--bg-2);font:400 11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.statusbar b{color:var(--cream);font-weight:500} .statusbar .ok b{color:var(--phos)} .statusbar .wn b{color:var(--amber)}
.side{background:var(--panel);min-width:0;display:flex;flex-direction:column}
.side .strip{border:none;border-bottom:1px solid var(--line-soft);border-radius:0;background:transparent}
.side .strip canvas{height:80px}
.blk{padding:12px 16px;border-bottom:1px solid var(--line-soft);min-width:0}
.blk h2{margin:2px 0 6px;font:500 16px/1.3 var(--ui);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.blk h2 .count{font:300 26px/1 var(--mono);color:var(--phos);font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(77,255,145,.4)}
.blk h2 small{font:400 12px var(--mono);color:var(--cream-2)}
#dd svg{display:block;width:100%;height:auto}
.stages{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.st{display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center;font:400 12px var(--mono)}
.st .nm{color:var(--cream-2)} .st.on .nm{color:var(--phos)}
.st .tr{height:6px;background:var(--line-soft);overflow:hidden}
.st .tr i{display:block;height:100%;width:0;background:var(--phos);box-shadow:0 0 6px var(--phos)}
.st .pc{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mode{font:500 11px var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.mode.on{background:var(--phos);border-color:var(--phos);color:var(--bg)}
.mode.done{color:var(--cream-2);border-color:var(--phos-2)}
.files{list-style:none;margin:8px 0 0;padding:0;font:400 12px/1.5 var(--mono);display:flex;flex-direction:column;gap:2px;max-height:220px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.files li{display:flex;gap:8px;min-width:0}
.files li .f{color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.files li .m{margin-left:auto;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.files li .p{color:var(--phos);flex:none}
.files .empty{color:var(--muted)}
@media (max-width:980px){.body{grid-template-columns:1fr}.term{border-right:none;border-bottom:1px solid var(--line)}.term .log{min-height:480px}}
@media (max-width:560px){.term .log{font-size:12px;padding-inline:12px;min-height:440px}.statusbar{padding-inline:12px}}
</style>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="app" id="app">
  <div class="chrome">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1 class="glow" data-meta="path"></h1>
    <div class="live"><i></i><span id="liveTxt">live</span></div>
  </div>
  <div class="body">
    <section class="term" aria-label="Compiler output">
      <div class="log" id="log"></div>
      <div class="statusbar" id="status"></div>
    </section>
    <aside class="side">
      <section class="strip" id="strip" aria-label="Live telemetry"></section>
      <div class="blk">
        <div class="eyebrow">Options in play · live</div>
        <h2><span class="count" id="count">1</span><small id="unit">brief</small></h2>
        <div id="dd"></div>
      </div>
      <div class="blk">
        <div class="eyebrow">Phases · d.school modes</div>
        <div class="stages" id="stages"></div>
        <div class="modes" id="modes"></div>
      </div>
      <div class="blk" style="border-bottom:none;flex:1">
        <div class="eyebrow"><span class="concept">Concept study</span> · artifacts emitted · <span id="nfiles">0</span></div>
        <ul class="files" id="files"></ul>
      </div>
    </aside>
  </div>
{{SHARED}}
</div>
