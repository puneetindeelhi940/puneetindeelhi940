<style>
/* Layout: metric strip, live telemetry, then agent roster | conversation stream | handoff graph + guardrails + human gates. */
.mstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.m{border:1px solid var(--line-soft);border-radius:var(--r);padding:9px 12px;background:var(--panel);min-width:0}
.m .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .v{font:300 24px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.m .n{font:400 11px var(--mono);color:var(--cream-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v.good{color:var(--phos);text-shadow:0 0 10px rgba(77,255,145,.35)} .v.warn{color:var(--amber)}
.main{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;gap:10px;align-items:stretch}
.col{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--panel);min-width:0;display:flex;flex-direction:column;overflow:hidden}
.col > header{padding:9px 12px;border-bottom:1px solid var(--line-soft);background:var(--bg-2);display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.col > header h2{margin:0;font:500 12.5px var(--mono);flex:none}
.col > header span{margin-left:auto;font:400 11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bg{padding:5px 12px;border-bottom:1px dashed var(--line-soft);font:400 11px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bg b{color:var(--phos-2);font-weight:400}
.roster{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.ag{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:7px 8px;border-radius:6px;border:1px solid transparent}
.ag .av{grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:500 11px var(--mono);color:var(--bg)}
.ag .nm{font:500 12.5px var(--mono);color:var(--cream);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag .st{font:500 9.5px var(--mono);letter-spacing:.08em;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.ag .tk{grid-column:2 / span 2;font:400 11px var(--ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ag.working{border-color:var(--phos-2);background:var(--panel-hi)}
.ag.working .st{background:var(--phos);border-color:var(--phos);color:var(--bg)}
.ag.reading .st{border-color:var(--teal);color:var(--teal)}
.ag.revising .st{border-color:var(--coral);color:var(--coral)}
.ag.reviewing .st{border-color:var(--amber);color:var(--amber)}
.ag.human{border:1px dashed var(--amber)}
.ag.human.working{background:#1f2a12}
.ag.human.working .st{background:var(--amber);border-color:var(--amber)}
.stream{flex:1 1 0;min-height:560px;overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:2px 10px;animation:lnin .25s ease-out}
.ev .ts{font:400 11px var(--mono);color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.ev .who{font:400 11.5px var(--mono);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .who b{font-weight:500}
.ev .tx{grid-column:2;font:400 13.5px/1.5 var(--ui);color:var(--cream)}
.ev.tool .tx{font:400 12px/1.5 var(--mono);color:var(--cream-2)}
.ev.tool .tx::before{content:'▸ ';color:var(--phos)}
.ev.think .tx{color:var(--cream-2);font-style:italic}
.ev.sys .tx{font:400 12px var(--mono);color:var(--muted)}
.ev.pass .tx,.ev.block .tx,.ev.flag .tx{border-left:3px solid var(--phos);padding:4px 10px;background:rgba(77,255,145,.06)}
.ev.block .tx{border-color:var(--coral);background:rgba(255,143,122,.08)}
.ev.flag .tx{border-color:var(--amber);background:rgba(242,196,107,.07)}
.ev.gate .tx,.ev.approve .tx{border:1px solid var(--amber);border-radius:6px;padding:8px 12px;background:rgba(242,196,107,.06)}
.ev.approve .tx{border-color:var(--phos);background:rgba(77,255,145,.07)}
.tag{display:inline-block;font:500 9.5px var(--mono);letter-spacing:.1em;padding:1px 6px;border-radius:3px;margin-right:6px;vertical-align:1px;color:var(--bg)}
.tag.pass,.tag.ok{background:var(--phos)} .tag.block{background:var(--coral)} .tag.flag,.tag.gate{background:var(--amber)}
.typing{font:400 11.5px var(--mono);color:var(--muted);padding-left:54px}
.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--phos-2);margin-right:3px;animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-3px);opacity:.5}}
.c-q{color:var(--cream-2);font-style:italic}
#graph svg{display:block;width:100%;height:auto}
.sect{padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.sect:last-child{border-bottom:none}
.rails{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font:400 12px var(--mono)}
.rails li{display:flex;gap:8px;align-items:baseline;min-width:0}
.rails li .l{color:var(--cream-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rails li .r{margin-left:auto;color:var(--cream);flex:none;font-variant-numeric:tabular-nums}
.rails li .r.good{color:var(--phos)} .rails li .r.warn{color:var(--amber)} .rails li .r.bad{color:var(--coral)}
.gates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.gt{border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;font:500 11px var(--mono);color:var(--muted)}
.gt small{display:block;font-weight:400;font-size:10px;margin-top:1px}
.gt.wait{border-color:var(--amber);color:var(--amber)}
.gt.ok{border-color:var(--phos);background:rgba(77,255,145,.1);color:var(--phos)}
@media (max-width:1200px){.main{grid-template-columns:230px minmax(0,1fr)}.right{grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.mstrip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.main{grid-template-columns:1fr}.right{grid-template-columns:1fr}.roster{flex-direction:row;overflow-x:auto;padding:8px}.ag{min-width:190px}.stream{min-height:460px}.mstrip{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.ev{animation:none}.typing i{animation:none}}
</style>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="app" id="app">
  <div class="chrome">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1 class="glow" data-meta="path"></h1>
    <div class="live"><i></i><span id="liveTxt">live</span></div>
  </div>
  <section class="mstrip" id="mstrip" aria-label="Swarm metrics"></section>
  <section class="strip" id="strip" aria-label="Live telemetry"></section>
  <div class="main">
    <section class="col" aria-label="Agents">
      <header><h2>agents</h2><span id="nActive">0 working</span></header>
      <ul class="roster" id="roster"></ul>
    </section>
    <section class="col" aria-label="Conversation">
      <header><h2>swarm.log</h2><span class="concept">Concept study</span><span id="phaseLbl">Discover · Empathize</span></header>
      <div class="bg" id="bgjob" aria-hidden="true"></div>
      <div class="stream" id="stream"></div>
    </section>
    <section class="col right" aria-label="Handoffs, guardrails and gates">
      <div class="sect"><div class="eyebrow">Handoff graph · live</div><div id="graph"></div></div>
      <div class="sect">
        <div class="eyebrow">Guardrails</div>
        <ul class="rails" id="rails"></ul>
        <div class="eyebrow" style="margin-top:12px">Human-in-the-loop gates</div>
        <div class="gates" id="gates"></div>
      </div>
    </section>
  </div>
{{SHARED}}
</div>
